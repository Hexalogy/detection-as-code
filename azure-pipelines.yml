trigger:
  branches:
    include:
      - main
  paths:
    include:
      - detections/*
      - infra/*
      - scripts/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - detections/*
      - infra/*
      - scripts/*
      - azure-pipelines.yml

variables:
  azureServiceConnection: 'sc-dac-lab-azure'
  resourceGroupName: 'rg-dac-lab-dev'
  location: 'eastus'
  workspaceName: 'law-dac-dev-001'

stages:
- stage: Validate
  displayName: Validate detections
  jobs:
  - job: Validation
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: AzureCLI@2
      displayName: Build Bicep
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az bicep install
          az bicep build --file infra/main.bicep

    - bash: |
        python -m pip install --upgrade pip
        pip install sigma-cli
        if [ -d "detections/sigma" ]; then
          sigma check detections/sigma
        fi
      displayName: Validate Sigma rules

    - task: PowerShell@2
      displayName: Install PowerShell YAML module
      inputs:
        targetType: inline
        pwsh: true
        script: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force

    - task: PowerShell@2
      displayName: Validate detection contracts
      inputs:
        targetType: filePath
        filePath: scripts/validate.ps1
        pwsh: true
    
- stage: Deploy_Dev
  displayName: Deploy to Sentinel dev
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeploySentinelContent
    displayName: Deploy analytics rules
    environment: dac-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: What-if Deployment
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group what-if \
                  --name "whatif-$(Build.BuildId)" \
                  --resource-group $(resourceGroupName) \
                  --parameters infra/parameters/dev.bicepparam \
                  --template-file infra/main.bicep

                  
          - task: AzureCLI@2
            displayName: Deploy Detections
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group create \
                  --name "dac-$(Build.BuildId)" \
                  --resource-group $(resourceGroupName) \
                  --parameters infra/parameters/dev.bicepparam \
                  --template-file infra/main.bicep
