trigger:
  branches:
    include:
      - main
  paths:
    include:
      - detections/*
      - infra/*
      - scripts/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - detections/*
      - infra/*
      - scripts/*
      - azure-pipelines.yml

variables:
  azureServiceConnection: 'sc-dac-lab-azure'
  resourceGroupName: 'rg-dac-lab-dev'
  location: 'eastus'
  workspaceName: 'law-dac-dev-001'

stages:
- stage: Validate
  displayName: Validate detections
  jobs:
  - job: Validation
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: AzureCLI@2
      displayName: Build Bicep
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az bicep install
          az bicep build --file infra/main.bicep

    - bash: |
        python -m pip install --upgrade pip
        pip install sigma-cli
        if [ -d "detections/sigma" ]; then
          sigma check detections/sigma
        fi
      displayName: Validate Sigma rules

    - bash: |
        python3 - <<'PY'
        import pathlib
        import sys
        import yaml

        rule_files = list(pathlib.Path("detections/sentinel").rglob("*.bicep"))
        if not rule_files:
            print("No Sentinel Bicep rules found.")
            sys.exit(1)

        print(f"Validated discovery of {len(rule_files)} Sentinel rule file(s).")
        PY
      displayName: Check detection structure

- stage: Deploy_Dev
  displayName: Deploy to Sentinel dev
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeploySentinelContent
    displayName: Deploy analytics rules
    environment: dac-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: What-if deployment
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(resourceGroupName) \
                  --template-file infra/main.bicep \
                  --parameters @infra/parameters/dev.bicepparam

          - task: AzureCLI@2
            displayName: Deploy detections
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group create \
                  --name "dac-$(Build.BuildId)" \
                  --resource-group $(resourceGroupName) \
                  --template-file infra/main.bicep \
                  --parameters @infra/parameters/dev.bicepparam